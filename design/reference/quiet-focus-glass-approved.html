<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Verse Listener · Quiet Focus Glass</title>
<style>
:root{
  color-scheme: light;
  --bg:#eef3f8;
  --ink:#16202a;
  --muted:#72808d;
  --faint:#9aa5af;
  --accent:#6675f5;
  --accent-2:#a175f4;
  --good:#4bb8cf;
  --warn:#d09a56;
  --bad:#d8657d;
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.72);
  --line:rgba(50,66,84,.11);
  --shadow:0 22px 60px rgba(45,64,84,.12);
  --blur:blur(24px) saturate(1.15);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{min-width:320px;min-height:100%}
body{
  margin:0;
  color:var(--ink);
  background:
    radial-gradient(circle at 14% -6%,rgba(112,182,230,.23),transparent 32%),
    radial-gradient(circle at 92% 14%,rgba(161,128,221,.17),transparent 30%),
    linear-gradient(160deg,#f5f8fb 0%,#edf2f6 48%,#f4f1f8 100%);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 70%,white);outline-offset:2px}
[hidden]{display:none!important}
svg{display:block}
.ico{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.lg{width:27px;height:27px}

/* Original #7 geometry is intentionally preserved */
.app{
  --c7-bg:rgba(251,250,247,.50);
  --c7-text:#171917;
  --c7-muted:#858985;
  --c7-green:#6675f5;
  width:min(100%,468px);
  min-height:100dvh;
  margin:0 auto;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  padding:16px 18px 90px;
  overflow:hidden;
  background:var(--c7-bg);
  color:var(--c7-text);
  border-inline:1px solid rgba(255,255,255,.4);
  box-shadow:var(--shadow);
  backdrop-filter:var(--blur);
  isolation:isolate;
}
.app::before,.app::after{
  content:"";
  position:absolute;
  border-radius:50%;
  filter:blur(24px);
  z-index:-1;
  pointer-events:none;
  opacity:.9;
}
.app::before{width:220px;height:220px;top:58px;right:-112px;background:radial-gradient(circle at 38% 38%,rgba(91,210,244,.32) 0%,rgba(111,173,241,.18) 34%,rgba(103,119,245,.08) 56%,transparent 74%)}
.app::after{width:205px;height:205px;bottom:82px;left:-112px;background:radial-gradient(circle at 58% 42%,rgba(183,124,246,.27) 0%,rgba(147,120,241,.15) 36%,rgba(100,170,237,.06) 58%,transparent 76%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top strong{font-size:11px;letter-spacing:.02em}
.top-actions{display:flex;gap:6px}
.top button{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.52);border-radius:50%;background:rgba(255,255,255,.34);color:#707570;box-shadow:inset 0 1px rgba(255,255,255,.7);backdrop-filter:blur(14px);transition:150ms ease}
.top button:hover{background:rgba(255,255,255,.56);color:#525a54}
.top button:active{transform:scale(.94)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:420px;text-align:center}
.status{display:flex;align-items:center;gap:7px;color:var(--c7-muted);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(102,117,245,.10)}
.mic{
  width:142px;height:142px;display:grid;place-items:center;margin-top:22px;
  position:relative;border:1px solid rgba(255,255,255,.74);border-radius:50%;
  background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.9),rgba(255,255,255,.40) 48%,rgba(229,237,243,.36));
  color:var(--c7-green);
  box-shadow:0 22px 60px rgba(45,58,49,.10),inset 0 1px rgba(255,255,255,.9);
  backdrop-filter:blur(18px);
  transition:180ms ease;
}
.mic::before{content:"";position:absolute;width:168px;height:168px;border:1px solid rgba(102,117,245,.11);border-radius:50%}
.mic::after{content:"";position:absolute;width:154px;height:154px;border:1px solid rgba(86,119,200,.10);border-radius:50%;opacity:0}
.app.listening .mic{color:#466f5d;box-shadow:0 22px 60px rgba(45,58,49,.11),0 0 0 8px rgba(102,117,245,.04),inset 0 1px rgba(255,255,255,.9)}
.app.listening .mic::before{animation:quietRing 2s ease-out infinite}
.app.listening .mic::after{opacity:1;animation:quietRing2 2s .7s ease-out infinite}
.app.detected .mic{animation:detectLift .7s ease-out}
@keyframes quietRing{70%,100%{transform:scale(1.18);opacity:0}}
@keyframes quietRing2{70%,100%{transform:scale(1.22);opacity:0}}
@keyframes detectLift{0%{transform:scale(1)}35%{transform:scale(1.04)}100%{transform:scale(1)}}
.center h1{margin:34px 0 0;font:500 37px/1 Georgia,serif;letter-spacing:-.045em}
.center h1 span{color:var(--c7-green)}
.center p{max-width:350px;margin:12px auto 0;color:#6e746f;font:400 13px/1.65 Georgia,serif}
.peek{margin-top:22px;border:0;border-bottom:1px solid #b9bcb7;padding:0 0 4px;background:transparent;color:#686e69;font-size:9px;font-weight:800}
.mode{display:flex;justify-content:center;gap:7px;margin-top:24px;flex-wrap:wrap}
.mode button{border:1px solid rgba(255,255,255,.64);border-radius:999px;padding:6px 9px;background:rgba(255,255,255,.32);color:#737b75;font-size:8px;font-weight:750;box-shadow:inset 0 1px rgba(255,255,255,.72);backdrop-filter:blur(12px);transition:150ms ease}
.mode button:hover{background:rgba(255,255,255,.56);color:#535b55}
.mode button:active{transform:scale(.97)}
.bottom{position:absolute;right:14px;bottom:14px;left:14px;display:grid;grid-template-columns:repeat(4,42px) 1fr;justify-content:center;gap:6px}
.bottom button{min-height:44px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.66);border-radius:50%;background:rgba(255,255,255,.46);color:#777c77;box-shadow:inset 0 1px rgba(255,255,255,.76),0 8px 18px rgba(53,69,83,.05);backdrop-filter:blur(16px);transition:150ms ease}
.bottom button:hover{background:rgba(255,255,255,.68);color:#545b55;transform:translateY(-1px)}
.bottom button:active{transform:scale(.94)}
.bottom .listen{border-radius:999px;border-color:rgba(102,117,245,.10);background:rgba(102,117,245,.92);color:white;font-size:9px;font-weight:850;box-shadow:0 10px 24px rgba(102,117,245,.20)}
.bottom .listen:hover{background:#5f6df4;color:#fff}

/* Subtle detected reference treatment without changing the original layout */
.reference-wrap{position:relative}
.reference-glow{position:absolute;inset:-16px -22px;border-radius:28px;background:radial-gradient(circle,rgba(98,127,205,.10),transparent 68%);opacity:0;pointer-events:none}
.app.detected .reference-glow{animation:verseGlow 1.15s ease-out}
@keyframes verseGlow{0%{opacity:0;transform:scale(.92)}25%{opacity:1}100%{opacity:0;transform:scale(1.08)}}

/* Floating preference popover */
.popover{
  position:absolute;z-index:40;left:50%;bottom:88px;width:min(calc(100% - 36px),330px);transform:translate(-50%,10px) scale(.98);
  opacity:0;pointer-events:none;border:1px solid rgba(255,255,255,.72);border-radius:18px;padding:10px;
  background:rgba(250,252,253,.72);box-shadow:0 18px 46px rgba(45,60,79,.16);backdrop-filter:blur(26px) saturate(1.18);transition:170ms ease;
}
.popover.open{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.popover-head{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 8px}
.popover-head strong{font-size:10px}
.popover-close{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(70,84,98,.06);color:var(--muted)}
.option-list{display:grid;gap:5px}
.option{min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid transparent;border-radius:11px;padding:0 10px;background:transparent;color:#5d6861;font-size:10px;text-align:left}
.option:hover{background:rgba(255,255,255,.54)}
.option.active{border-color:rgba(86,119,200,.10);background:rgba(86,119,200,.08);color:#435a8d}
.option .check{opacity:0}
.option.active .check{opacity:1}

/* Sheets: nested features inherit the same calm glass language */
.sheet-layer{position:absolute;z-index:60;inset:0;display:flex;align-items:flex-end;pointer-events:none;background:rgba(36,46,58,0);transition:180ms ease}
.sheet-layer.open{pointer-events:auto;background:rgba(36,46,58,.18)}
.sheet{
  width:100%;max-height:86%;overflow:auto;border-top:1px solid rgba(255,255,255,.78);border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  background:rgba(247,250,252,.80);box-shadow:0 -24px 64px rgba(44,61,78,.18);backdrop-filter:blur(30px) saturate(1.18);
  transform:translateY(22px);opacity:0;transition:220ms cubic-bezier(.2,.8,.2,1);
}
.sheet-layer.open .sheet{transform:none;opacity:1}
.sheet-handle{width:38px;height:4px;margin:2px auto 13px;border-radius:999px;background:rgba(61,72,82,.15)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sheet-head h2{margin:0;font-size:15px;letter-spacing:-.02em}
.sheet-head button{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(255,255,255,.48);color:var(--muted)}
.sheet-section+ .sheet-section{margin-top:17px}
.sheet-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:#89939c;font-size:8px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.sheet-label strong{color:#59636c;font-size:9px;letter-spacing:0;text-transform:none}
.glass-row{border:1px solid rgba(255,255,255,.68);border-radius:14px;background:rgba(255,255,255,.36);box-shadow:inset 0 1px rgba(255,255,255,.65);backdrop-filter:blur(14px)}

/* Transcript */
.transcript-viewport{max-height:min(46dvh,420px);overflow-y:auto;overscroll-behavior:contain;padding:2px 2px 4px;scrollbar-width:thin;scrollbar-color:rgba(102,117,245,.22) transparent}
.transcript-viewport::-webkit-scrollbar{width:6px}.transcript-viewport::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(102,117,245,.20)}
.transcript-stream{display:grid;gap:7px}
.transcript-row{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.64);border-radius:13px;padding:10px 11px;background:rgba(255,255,255,.34);color:#66716b;font-size:11px;line-height:1.5;transition:180ms ease}
.transcript-row.enter{animation:transcriptSlideIn .42s cubic-bezier(.2,.82,.2,1) both}
@keyframes transcriptSlideIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.sheet.transcript-sheet{max-height:60%}
.transcript-row.live{border-color:rgba(86,119,200,.12);background:rgba(86,119,200,.07);color:#44556b}
.transcript-row.detected{border-color:rgba(102,117,245,.14);background:rgba(102,117,245,.07)}
.transcript-row.detected::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:999px;background:var(--accent)}
.loading-row{min-height:43px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;border:1px solid rgba(86,119,200,.10);border-radius:13px;padding:8px 11px;background:rgba(255,255,255,.26);color:#74808c;font-size:9px;font-weight:750}
.loading-wave{height:18px;display:flex;align-items:center;gap:3px;overflow:hidden}
.loading-wave i{width:3px;height:5px;border-radius:999px;background:rgba(86,119,200,.34);animation:wave 1s ease-in-out infinite}
.loading-wave i:nth-child(2){animation-delay:.08s}.loading-wave i:nth-child(3){animation-delay:.16s}.loading-wave i:nth-child(4){animation-delay:.24s}.loading-wave i:nth-child(5){animation-delay:.32s}.loading-wave i:nth-child(6){animation-delay:.40s}.loading-wave i:nth-child(7){animation-delay:.48s}.loading-wave i:nth-child(8){animation-delay:.56s}
@keyframes wave{0%,100%{height:4px;opacity:.38}50%{height:17px;opacity:1}}

/* Common controls */
.select-wrap{position:relative}
.select-wrap::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.5px solid #77828d;border-bottom:1.5px solid #77828d;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.styled-select,.styled-input,.styled-textarea{width:100%;border:1px solid rgba(255,255,255,.70);border-radius:12px;background:rgba(255,255,255,.36);color:#56626d;box-shadow:inset 0 1px rgba(255,255,255,.65);backdrop-filter:blur(12px)}
.styled-select{appearance:none;min-height:42px;padding:0 36px 0 11px;font-size:10px;font-weight:750}
.styled-input{min-height:42px;padding:0 11px;font-size:10px}
.styled-textarea{min-height:100px;padding:10px 11px;resize:vertical;font-size:10px;line-height:1.5}
.choice-row{display:flex;gap:6px;flex-wrap:wrap}
.choice{min-height:32px;border:1px solid rgba(255,255,255,.68);border-radius:999px;padding:0 10px;background:rgba(255,255,255,.32);color:#75808a;font-size:9px;font-weight:750}
.choice.active{border-color:rgba(86,119,200,.10);background:rgba(86,119,200,.10);color:#4962a0}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.btn{min-height:40px;border:1px solid rgba(255,255,255,.68);border-radius:12px;background:rgba(255,255,255,.38);color:#66716b;font-size:9px;font-weight:800;box-shadow:inset 0 1px rgba(255,255,255,.64)}
.btn.primary{border-color:rgba(102,117,245,.10);background:rgba(102,117,245,.92);color:#fff}
.btn.purple{border-color:rgba(127,107,200,.10);background:rgba(127,107,200,.88);color:#fff}
.btn.rose{border-color:rgba(184,95,112,.10);background:rgba(184,95,112,.12);color:#9b4e60}
.btn:disabled{opacity:.42;cursor:not-allowed}
.status-line{min-height:16px;margin-top:7px;color:#7d8791;font-size:9px;line-height:1.45}

/* Model download */
.download-box{padding:12px}
.download-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.download-top strong{font-size:10px}.download-top span{color:#7d8791;font-size:9px}
.progress-track{height:5px;overflow:hidden;margin-top:10px;border-radius:999px;background:rgba(77,91,106,.08)}
.progress-fill{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),#7b78cd,#69a4c8);transition:width .18s ease}
.progress-track.indeterminate .progress-fill{width:34%!important;animation:progressMove .85s ease-in-out infinite}
@keyframes progressMove{0%{transform:translateX(-120%)}100%{transform:translateX(340%)}}

/* Mic */
.meter{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;padding:8px;border-radius:13px;background:rgba(255,255,255,.28)}
.meter i{height:23px;border-radius:3px;background:rgba(80,94,106,.08);transition:120ms ease}
.meter i.on{background:rgba(75,184,207,.72);box-shadow:0 0 8px rgba(75,184,207,.16)}
.meter i.hot{background:rgba(183,131,75,.75)}
.meter i.peak{background:rgba(184,95,112,.78)}
.record-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 8px;background:rgba(184,95,112,.10);color:#9c4f60;font-size:8px;font-weight:800}
.record-pill i{width:6px;height:6px;border-radius:50%;background:#b85f70;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.38;transform:scale(.85)}}

/* Benchmark */
.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.model-card{border:1px solid rgba(255,255,255,.68);border-radius:14px;padding:11px;background:rgba(255,255,255,.32);text-align:left;color:#66716b}
.model-card strong{display:block;font-size:10px}.model-card span{display:block;margin-top:3px;color:#939da7;font-size:8px}
.model-card.active{border-color:rgba(127,107,200,.16);background:rgba(127,107,200,.08);color:#5e53a0}
.result-list{display:grid;gap:7px}
.result-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 11px}
.result-row strong{display:block;font-size:10px}.result-row span{display:block;margin-top:2px;color:#8d98a2;font-size:8px}.score{color:#5c6891!important;font-weight:800!important}

/* More/settings */
.menu-list{display:grid;gap:6px}
.menu-item{min-height:46px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.66);border-radius:13px;padding:0 11px;background:rgba(255,255,255,.30);color:#657069;text-align:left}
.menu-icon{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:rgba(86,119,200,.08);color:#536ca9}
.menu-item strong{display:block;font-size:10px}.menu-item span{display:block;margin-top:2px;color:#9099a1;font-size:8px}

/* Toast */
.toast{position:absolute;z-index:90;left:50%;bottom:78px;max-width:calc(100% - 40px);transform:translate(-50%,10px);opacity:0;pointer-events:none;border:1px solid rgba(255,255,255,.60);border-radius:999px;padding:8px 11px;background:rgba(35,46,56,.82);color:white;box-shadow:0 14px 34px rgba(25,34,42,.18);backdrop-filter:blur(16px);font-size:8px;font-weight:750;transition:160ms ease}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(min-width:469px){body{padding:22px 0}.app{min-height:calc(100dvh - 44px);border:1px solid rgba(255,255,255,.56);border-radius:26px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* Glass palette refinement: original #7 geometry, Glass Dock color system */
body{background:radial-gradient(circle at 10% -4%,rgba(95,200,236,.30),transparent 32%),radial-gradient(circle at 94% 12%,rgba(178,131,255,.26),transparent 31%),linear-gradient(150deg,#eaf7ff 0%,#f4efff 48%,#edf5ff 100%)}
.app{background:rgba(250,252,255,.44);border-inline-color:rgba(255,255,255,.58)}
.app::before{background:radial-gradient(circle at 34% 32%,rgba(101,224,255,.38) 0%,rgba(95,190,236,.24) 30%,rgba(103,121,245,.10) 57%,transparent 78%)}.app::after{background:radial-gradient(circle at 62% 38%,rgba(193,127,255,.32) 0%,rgba(155,111,241,.20) 32%,rgba(102,170,239,.08) 58%,transparent 79%)}
.status-dot{background:linear-gradient(135deg,#6cd4ef,#7279f7);box-shadow:0 0 0 4px rgba(102,117,245,.10)}
.mic{color:var(--accent);box-shadow:0 22px 60px rgba(84,91,160,.12),inset 0 1px rgba(255,255,255,.94)}
.mic::before{border-color:rgba(102,117,245,.12)}
.mic::after{border-color:rgba(87,198,234,.13)}
.app.listening .mic{color:#6675f5;box-shadow:0 22px 60px rgba(91,96,175,.14),0 0 0 8px rgba(102,117,245,.04),inset 0 1px rgba(255,255,255,.92)}
.app.model-loading .mic{background:conic-gradient(from -90deg,rgba(102,117,245,.74) 0 var(--load-progress,0deg),rgba(255,255,255,.20) var(--load-progress,0deg) 360deg);padding:3px}
.app.model-loading .mic>svg{width:100%;height:100%;padding:54px;border-radius:50%;background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.94),rgba(255,255,255,.58) 55%,rgba(236,239,255,.56));color:var(--accent)}
.center h1 span{color:var(--accent)}
.peek{border-bottom-color:rgba(102,117,245,.28);color:#66718d}
.bottom .listen{border-color:rgba(102,117,245,.14);background:linear-gradient(135deg,rgba(102,117,245,.96),rgba(142,111,238,.92));box-shadow:0 10px 26px rgba(102,117,245,.24)}
.bottom .listen:hover{background:linear-gradient(135deg,#5f6df4,#8c68e8)}
.transcript-row.detected{border-color:rgba(102,117,245,.15);background:linear-gradient(90deg,rgba(102,117,245,.08),rgba(95,199,235,.055))}
.transcript-row.detected::before{background:linear-gradient(#6675f5,#63c7e8)}
.btn.primary{border-color:rgba(102,117,245,.12);background:linear-gradient(135deg,rgba(102,117,245,.94),rgba(141,111,238,.90));color:#fff}
.option.active,.choice.active{border-color:rgba(102,117,245,.13);background:rgba(102,117,245,.09);color:#535fb0}
.menu-icon{background:rgba(102,117,245,.08);color:#6675f5}

.typing-caret{display:inline-block;width:1px;height:1em;margin-left:3px;vertical-align:-2px;background:var(--accent);animation:caretBlink .7s steps(1) infinite}
@keyframes caretBlink{50%{opacity:0}}
.transcript-row small{display:block;margin-top:4px;color:#6977d4;font-size:8px;font-weight:800}
.empty-state{border:1px dashed rgba(99,113,148,.14);border-radius:13px;padding:13px;color:#8b96a2;font-size:9px;text-align:center}
.mini-note{color:#7c8792;font-size:9px;line-height:1.5}
.url-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}
.url-row .btn{padding:0 12px}
.video-card{display:flex;align-items:center;gap:10px;padding:9px}.video-card>div:last-child{min-width:0}.video-card strong{display:block;font-size:10px}.video-card span{display:block;margin-top:2px;color:#8d98a5;font-size:8px}

/* Adjustment pass · true glass gradients, stronger active states, simpler sheets */
body{overflow-x:hidden}
.app::before{background:radial-gradient(circle at 38% 38%,rgba(91,210,244,.32) 0%,rgba(111,173,241,.18) 34%,rgba(103,119,245,.08) 56%,transparent 74%)}
.app::after{background:radial-gradient(circle at 58% 42%,rgba(183,124,246,.27) 0%,rgba(147,120,241,.15) 36%,rgba(100,170,237,.06) 58%,transparent 76%)}
.top button,.mode button,.bottom button,.btn,.choice,.sheet-head button,.menu-item{box-shadow:none}
.top button{border-color:rgba(91,108,138,.14);background:linear-gradient(145deg,rgba(255,255,255,.64),rgba(255,255,255,.30));color:#526172;box-shadow:0 7px 18px rgba(66,82,105,.08)}
.top button:hover{border-color:rgba(102,117,245,.20);background:linear-gradient(145deg,rgba(255,255,255,.84),rgba(237,241,255,.52));color:#4f5f91}
.bottom button:not(.listen){border-color:rgba(79,96,124,.14);background:linear-gradient(145deg,rgba(255,255,255,.66),rgba(255,255,255,.28));color:#59687a;box-shadow:0 7px 18px rgba(66,82,105,.07)}
.mode button{border-color:rgba(79,96,124,.13);background:linear-gradient(145deg,rgba(255,255,255,.60),rgba(255,255,255,.24));color:#617083}
.status{min-height:27px;border-radius:999px;padding:0 10px;transition:180ms ease}
.app.listening .status{color:#5363cc;background:rgba(102,117,245,.09);box-shadow:0 0 0 1px rgba(102,117,245,.09),0 8px 24px rgba(102,117,245,.10)}
.app.listening .status-dot{box-shadow:0 0 0 5px rgba(102,117,245,.10),0 0 18px rgba(102,117,245,.52);animation:activeStatus 1.05s ease-in-out infinite}
@keyframes activeStatus{50%{transform:scale(1.18);filter:brightness(1.18)}}
.app.listening .mic{transform:scale(1.075);background:radial-gradient(circle at 42% 34%,rgba(255,255,255,.98),rgba(226,233,255,.68) 47%,rgba(148,139,242,.25) 72%,rgba(98,173,240,.18));box-shadow:0 28px 80px rgba(91,97,186,.22),0 0 0 11px rgba(102,117,245,.055),0 0 46px rgba(118,108,241,.20)}
.app.listening .mic::before{border-color:rgba(102,117,245,.32)}
.app.listening .mic::after{border-color:rgba(91,199,235,.28)}
.app.listening .reference-wrap{filter:drop-shadow(0 8px 20px rgba(102,117,245,.08))}
.bottom .listen{display:flex;align-items:center;justify-content:center;gap:7px;transition:180ms ease}
.app.listening .bottom .listen{background:linear-gradient(135deg,#706bf2 0%,#9a63e8 55%,#dc6b9a 118%);box-shadow:0 12px 30px rgba(122,91,224,.28);transform:translateY(-1px)}
.stop-square{width:7px;height:7px;border-radius:2px;background:currentColor;opacity:.92}
.app.model-loading .bottom .listen{background:linear-gradient(135deg,#6675f5,#8b72ed);opacity:.78}
.sheet{position:relative}
.sheet-head{margin-bottom:14px}
.sheet-head-actions{margin-left:auto;display:flex;gap:6px}
.sheet-head-actions button{width:32px;height:32px;display:grid;place-items:center;border:1px solid rgba(72,90,122,.12);border-radius:50%;background:rgba(255,255,255,.46);color:#647286}
.sheet-head-actions button:hover{background:rgba(255,255,255,.74);color:#5767bd}
.select-control{position:relative}
.select-trigger{width:100%;min-height:43px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid rgba(80,99,129,.13);border-radius:13px;padding:0 12px;background:linear-gradient(145deg,rgba(255,255,255,.58),rgba(255,255,255,.28));color:#596777;font-size:10px;font-weight:750;text-align:left;box-shadow:0 6px 16px rgba(67,82,104,.04)}
.select-trigger::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.65}
.select-control.open .select-trigger{border-color:rgba(102,117,245,.22);background:rgba(255,255,255,.72)}
.select-menu{position:absolute;z-index:12;top:calc(100% + 6px);right:0;left:0;display:grid;gap:3px;border:1px solid rgba(86,103,132,.13);border-radius:14px;padding:6px;background:rgba(248,251,255,.90);box-shadow:0 18px 44px rgba(48,64,90,.17);backdrop-filter:blur(24px) saturate(1.18);opacity:0;transform:translateY(-4px) scale(.985);pointer-events:none;transition:140ms ease}

.select-option{min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;border-radius:10px;padding:0 9px;background:transparent;color:#647184;font-size:9px;font-weight:720;text-align:left}

.select-option.active::after{content:"✓";font-size:10px;font-weight:900}
.feedback-mini{position:absolute;z-index:15;top:61px;right:18px;width:min(270px,calc(100% - 36px));border:1px solid rgba(79,97,126,.13);border-radius:15px;padding:10px;background:rgba(249,251,255,.91);box-shadow:0 18px 46px rgba(44,60,86,.18);backdrop-filter:blur(24px) saturate(1.18);color:#627083}
.feedback-mini strong{display:block;font-size:9px;color:#4f5c6c}.feedback-mini p{margin:5px 0 0;font-size:8px;line-height:1.55}.feedback-mini audio{width:100%;height:34px}
.feedback-fields{display:grid;gap:13px}.field-block label{display:block;margin:0 1px 6px;color:#85909c;font-size:8px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}

.analyzer-input{min-height:170px;font:10px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.analyze-button{width:100%;margin-top:8px;min-height:43px;display:flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:13px;background:linear-gradient(135deg,#6675f5,#8f70ed);color:white;font-size:9px;font-weight:850;box-shadow:0 9px 22px rgba(102,117,245,.18)}
.analyze-button.running{background:linear-gradient(90deg,#6675f5,#8e70eb,#65c7e9,#6675f5);background-size:220% 100%;animation:analyzeShift 1.2s linear infinite}

.report-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.report-metric{border:1px solid rgba(80,99,129,.10);border-radius:12px;padding:10px 5px;background:rgba(255,255,255,.34);text-align:center}.report-metric strong{display:block;color:#4d5a78;font-size:16px}.report-metric span{display:block;margin-top:2px;color:#8b95a1;font-size:7px}
.report-items{display:grid;gap:5px;margin-top:8px}.report-item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;border-radius:10px;padding:8px 9px;background:rgba(255,255,255,.29);font-size:8px;color:#657181}.report-item i{width:6px;height:6px;border-radius:50%;background:#66c5dd}.report-item strong{font-size:9px;color:#4c596c}.report-tag{border-radius:999px;padding:4px 7px;background:rgba(75,184,207,.10);color:#3f8ea1;font-weight:800}
.meter{border:1px solid rgba(80,99,129,.09);background:linear-gradient(145deg,rgba(255,255,255,.46),rgba(255,255,255,.24))}
.meter i{height:22px;border-radius:999px;background:rgba(80,94,106,.07)}
.meter i.on{background:linear-gradient(180deg,#6fd1e6,#6b83ef);box-shadow:0 0 8px rgba(94,160,231,.16)}
.meter i.hot{background:linear-gradient(180deg,#e5ae70,#cf88a5)}.meter i.peak{background:linear-gradient(180deg,#e97d9a,#a46de5)}
.recording-visual{position:relative;overflow:hidden;border-color:rgba(215,108,136,.14);background:linear-gradient(145deg,rgba(255,255,255,.42),rgba(216,101,125,.055))}
.recording-visual::after{content:"";position:absolute;inset:auto 0 0;height:38%;background:linear-gradient(180deg,transparent,rgba(216,101,125,.055));pointer-events:none}
.prototype-controls{width:min(calc(100% - 24px),620px);display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:12px auto 22px;position:relative;z-index:100}
.prototype-controls button{min-height:36px;display:flex;align-items:center;gap:7px;border:1px solid rgba(76,94,123,.13);border-radius:999px;padding:0 12px;background:rgba(255,255,255,.64);color:#5e6a7b;box-shadow:0 8px 22px rgba(55,71,95,.08);backdrop-filter:blur(18px);font-size:9px;font-weight:800}
.prototype-controls button:hover{border-color:rgba(102,117,245,.20);color:#5363bb;transform:translateY(-1px)}
.prototype-controls button.active{background:linear-gradient(135deg,rgba(102,117,245,.12),rgba(95,197,235,.10));color:#5363c3;border-color:rgba(102,117,245,.18)}

/* Final transcript/report polish */
.sheet.transcript-sheet{max-height:54%;overflow:hidden;display:flex;flex-direction:column}
.sheet.transcript-sheet #sheetContent{min-height:0;overflow:hidden;display:flex;flex:1}
.sheet.transcript-sheet .transcript-section-inner{min-height:0;display:flex;flex:1;flex-direction:column;width:100%}
.sheet.transcript-sheet .transcript-viewport{flex:1;min-height:0;max-height:none;overflow-y:auto;scrollbar-width:none;padding-right:1px}
.sheet.transcript-sheet .transcript-viewport::-webkit-scrollbar{display:none;width:0;height:0}
.transcript-play-toggle.active{color:#5c6deb!important;background:linear-gradient(145deg,rgba(102,117,245,.16),rgba(96,199,235,.10))!important;border-color:rgba(102,117,245,.20)!important}
.transcript-row.detected{grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding-right:8px}
.transcript-row-main{min-width:0}
.transcript-detection-meta{display:flex;align-items:center;gap:6px;align-self:center}
.confidence-pill{min-width:34px;border-radius:999px;padding:4px 6px;background:rgba(102,117,245,.08);color:#5e6aca;font-size:8px;font-weight:850;text-align:center}
.transcript-flag,.report-flag{width:28px;height:28px;display:grid;place-items:center;border:1px solid rgba(102,117,245,.12);border-radius:9px;background:rgba(255,255,255,.44);color:#6975c9;transition:150ms ease}
.transcript-flag .ico,.report-flag .ico{width:13px;height:13px}
.transcript-flag:hover,.report-flag:hover{transform:translateY(-1px);background:rgba(102,117,245,.11);color:#5867d2}
.transcript-row.detected.enter{animation:verseDetectedIn .72s cubic-bezier(.16,.86,.22,1) both}
.transcript-row.detected.enter::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 15%,rgba(255,255,255,.52) 48%,transparent 76%);transform:translateX(-125%);animation:verseSweep .85s ease-out .05s both;pointer-events:none}
@keyframes verseDetectedIn{0%{opacity:0;transform:translateY(22px) scale(.975);box-shadow:0 0 0 0 rgba(102,117,245,0)}45%{opacity:1;transform:translateY(0) scale(1.012);box-shadow:0 0 0 5px rgba(102,117,245,.08)}100%{transform:none;box-shadow:0 10px 24px rgba(91,105,196,.08)}}
@keyframes verseSweep{to{transform:translateX(125%)}}
.app.detected .reference-wrap{animation:referenceDetected .82s cubic-bezier(.16,.86,.22,1)}
.app.detected .reference-glow{animation:verseGlowStrong 1.4s ease-out}
@keyframes referenceDetected{0%{transform:scale(.965);filter:brightness(1)}35%{transform:scale(1.045);filter:brightness(1.12)}100%{transform:none;filter:none}}
@keyframes verseGlowStrong{0%{opacity:0;transform:scale(.82)}22%{opacity:1;transform:scale(1)}62%{opacity:.55;transform:scale(1.12)}100%{opacity:0;transform:scale(1.24)}}
.feedback-layer{position:absolute;z-index:78;inset:0;display:flex;align-items:flex-end;pointer-events:none;opacity:0;transition:180ms ease}
.feedback-layer.open{pointer-events:auto;opacity:1}
.feedback-backdrop{position:absolute;inset:0;border:0;background:rgba(30,38,52,.24);backdrop-filter:blur(3px)}
.feedback-panel{position:relative;z-index:1;width:calc(100% - 24px);max-height:78%;overflow:auto;margin:0 12px 12px;border:1px solid rgba(255,255,255,.72);border-radius:22px;padding:16px;background:rgba(248,251,255,.92);box-shadow:0 24px 70px rgba(33,46,68,.25);backdrop-filter:blur(30px) saturate(1.18);transform:translateY(16px);transition:220ms cubic-bezier(.2,.8,.2,1)}
.feedback-layer.open .feedback-panel{transform:none}
.feedback-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.feedback-panel-head h2{margin:0;font-size:14px}.feedback-overlay-actions{display:flex;gap:5px}.feedback-overlay-actions button{width:31px;height:31px;display:grid;place-items:center;border:1px solid rgba(80,99,129,.11);border-radius:50%;background:rgba(255,255,255,.48);color:#6a7688}
.feedback-panel .sheet-section+.sheet-section{margin-top:14px}
.feedback-fields{gap:11px}
.feedback-fields .styled-textarea{min-height:92px}
.transcriber-report{padding-top:2px}.report-items.spacious{gap:8px}.report-items.spacious .report-item{grid-template-columns:auto minmax(0,1fr) auto auto;gap:9px;min-height:48px;padding:11px 12px;border:1px solid rgba(80,99,129,.09);background:linear-gradient(145deg,rgba(255,255,255,.48),rgba(255,255,255,.27))}.report-items.spacious .report-item strong{font-size:10px}.report-confidence{color:#6270c7;font-size:8px;font-weight:850}
/* darker glass must remain fully legible */
body.theme-dark .sheet.transcript-sheet{background:rgba(17,23,39,.97)}
body.theme-dark .confidence-pill{background:rgba(115,132,255,.16);color:#d4dbff}
body.theme-dark .transcript-flag,body.theme-dark .report-flag{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#c8d1ff}
body.theme-dark .report-items.spacious .report-item{background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.045));border-color:rgba(255,255,255,.11)}
body.theme-dark .report-items.spacious .report-item strong{color:#edf1fb}body.theme-dark .report-confidence{color:#c7d0ff}
body.theme-dark .feedback-panel{background:rgba(19,25,42,.97);border-color:rgba(255,255,255,.11);color:#f3f6ff;box-shadow:0 28px 76px rgba(0,0,0,.56)}
body.theme-dark .feedback-overlay-actions button{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.11);color:#c9d2e5}
body.theme-dark .feedback-backdrop{background:rgba(5,9,18,.48)}
body.theme-dark .select-trigger{background:linear-gradient(145deg,rgba(255,255,255,.095),rgba(255,255,255,.055));border-color:rgba(255,255,255,.14);color:#eef2ff;box-shadow:inset 0 1px rgba(255,255,255,.05)}
body.theme-dark .select-option{color:#c1cadb}
body.theme-dark .select-option:hover{background:rgba(118,132,255,.10);color:#fff}
body.theme-dark .select-option.active{background:linear-gradient(90deg,rgba(105,123,248,.26),rgba(124,91,222,.18));color:#fff;box-shadow:inset 0 0 0 1px rgba(152,163,255,.12)}
body.theme-dark .feedback-fields .styled-textarea{background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.045));border-color:rgba(255,255,255,.11);color:#edf2ff}
body.theme-dark .loading-row{color:#b2bdd0}
body.theme-dark .transcript-row.detected.enter::after{background:linear-gradient(105deg,transparent 15%,rgba(137,166,255,.20) 48%,transparent 76%)}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
  <symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></symbol>
  <symbol id="settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21h-4v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14v-4a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3h4a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9A1.7 1.7 0 0 0 21 10v4a1.7 1.7 0 0 0-1.6 1Z"/></symbol>
  <symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  <symbol id="transcript" viewBox="0 0 24 24"><path d="M4 5h16M4 10h12M4 15h16M4 20h9"/></symbol>
  <symbol id="lab" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M8 15h8"/></symbol>
  <symbol id="volume" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
  <symbol id="flag" viewBox="0 0 24 24"><path d="M5 22V4M5 4h11l-1 4 1 4H5"/></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
  <symbol id="play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
  <symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
</svg>

<main class="app" id="app">
  <header class="top">
    <strong>Verse Listener</strong>
    <div class="top-actions">
      <button type="button" id="settingsBtn" aria-label="Settings"><svg class="ico"><use href="#settings"/></svg></button>
      <button type="button" id="moreBtn" aria-label="More"><svg class="ico"><use href="#more"/></svg></button>
    </div>
  </header>

  <section class="center">
    <div class="status"><i class="status-dot"></i><span id="statusText">Ready to listen</span></div>
    <button class="mic" id="heroMic" type="button" aria-label="Toggle listening"><svg class="ico lg"><use href="#mic"/></svg></button>
    <div class="reference-wrap">
      <i class="reference-glow"></i>
      <h1 id="reference">Иоанна <span>3:16</span></h1>
    </div>
    <p id="sourceText">Откроем Евангелие от Иоанна, третью главу, шестнадцатый стих.</p>
    <button class="peek" id="peekBtn" type="button">Peek at live transcript</button>
    <div class="mode">
      <button type="button" data-pref="language" id="languagePill">Русский</button>
      <button type="button" data-pref="model" id="modelPill">Whisper Base</button>
      <button type="button" data-pref="bible" id="biblePill">Synodal</button>
    </div>
  </section>

  <nav class="bottom" aria-label="Tools">
    <button type="button" data-sheet="transcript" aria-label="Transcript"><svg class="ico"><use href="#transcript"/></svg></button>
    <button type="button" data-sheet="transcriber" aria-label="Service transcriber"><svg class="ico"><use href="#lab"/></svg></button>
    <button type="button" data-sheet="mic" aria-label="Mic test"><svg class="ico"><use href="#volume"/></svg></button>
    <button type="button" data-sheet="feedback" aria-label="Feedback"><svg class="ico"><use href="#flag"/></svg></button>
    <button class="listen" type="button" id="listenBtn">Start listening</button>
  </nav>

  <div class="popover" id="popover" aria-hidden="true">
    <div class="popover-head"><strong id="popoverTitle">Choose</strong><button class="popover-close" id="popoverClose" type="button" aria-label="Close"><svg class="ico"><use href="#x"/></svg></button></div>
    <div class="option-list" id="optionList"></div>
  </div>

  <div class="sheet-layer" id="sheetLayer" aria-hidden="true">
    <section class="sheet" id="sheet">
      <div class="sheet-handle"></div>
      <header class="sheet-head"><h2 id="sheetTitle">Transcript</h2><div class="sheet-head-actions" id="sheetHeadActions"></div><button type="button" id="sheetClose" aria-label="Close"><svg class="ico"><use href="#x"/></svg></button></header>
      <div id="sheetContent"></div>
    </section>
  </div>

  <div class="feedback-layer" id="feedbackLayer" aria-hidden="true">
    <button class="feedback-backdrop" id="feedbackBackdrop" type="button" aria-label="Close feedback"></button>
    <section class="feedback-panel" id="feedbackPanel">
      <header class="feedback-panel-head"><h2>Report feedback</h2><div class="feedback-overlay-actions"><button type="button" id="overlayRecentTranscript" aria-label="Recent transcript"><svg class="ico"><use href="#transcript"/></svg></button><button type="button" id="overlayRecentAudio" aria-label="Recent audio"><svg class="ico"><use href="#volume"/></svg></button><button type="button" id="feedbackOverlayClose" aria-label="Close"><svg class="ico"><use href="#x"/></svg></button></div></header>
      <div id="feedbackOverlayContent"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>
</main>
<div class="prototype-controls" id="prototypeControls" aria-label="Prototype test controls">
  <button type="button" id="lightModeTest" class="active">Light glass</button>
  <button type="button" id="darkModeTest">Dark glass</button>
  <button type="button" id="runTranscriptTest">Run transcript</button>
  <button type="button" id="detectVerseTest">Detect verse</button>
</div>

<script>
const app=document.querySelector('#app');
const statusText=document.querySelector('#statusText');
const listenBtn=document.querySelector('#listenBtn');
const heroMic=document.querySelector('#heroMic');
const reference=document.querySelector('#reference');
const sourceText=document.querySelector('#sourceText');
const sheetLayer=document.querySelector('#sheetLayer');
const sheetTitle=document.querySelector('#sheetTitle');
const sheetContent=document.querySelector('#sheetContent');
const sheetHeadActions=document.querySelector('#sheetHeadActions');
const popover=document.querySelector('#popover');
const popoverTitle=document.querySelector('#popoverTitle');
const optionList=document.querySelector('#optionList');
const toast=document.querySelector('#toast');
const feedbackLayer=document.querySelector('#feedbackLayer');
const feedbackOverlayContent=document.querySelector('#feedbackOverlayContent');
let toastTimer=null;
let listening=false;
let starting=false;
let transcriptTimer=null;
let verseTimer=null;
let typingTimer=null;
let transcriptIndex=0;
let downloadTimer=null;
let micTimer=null;
let recordTimer=null;
let transcriberTimer=null;
let transcriberRunning=false;
let transcriberIndex=0;
let modelProgress=0;
let currentModel='Whisper Base';
const loadedModels=new Set();
let appearance='light';
let demoTranscriptRunning=false;
let transcriptPaused=false;
let activeFeedbackContext=null;

const svg=(id,cls='')=>`<svg class="ico ${cls}"><use href="#${id}"/></svg>`;
const transcriptLines=[
  {text:'Сегодня мы говорим о любви Божьей к миру.',kind:'final'},
  {text:'И эта любовь открывается нам в Писании.',kind:'final'},
  {text:'Откроем Евангелие от Иоанна.',kind:'final'},
  {text:'Третью главу, шестнадцатый стих.',kind:'detected',ref:'Иоанна 3:16',confidence:96},
  {text:'Ибо так возлюбил Бог мир, что отдал Сына Своего Единородного.',kind:'final'},
  {text:'Дабы всякий верующий в Него не погиб.',kind:'final'},
  {text:'Но имел жизнь вечную.',kind:'final'},
  {text:'Теперь посмотрим следующий стих.',kind:'next',ref:'Иоанна 3:17',confidence:94},
  {text:'Ибо не послал Бог Сына Своего в мир, чтобы судить мир.',kind:'final'},
  {text:'Но чтобы мир спасён был через Него.',kind:'final'},
  {text:'Это очень важная мысль для нас сегодня.',kind:'final'},
  {text:'Мы видим не осуждение, а Божье спасение.',kind:'final'},
  {text:'А теперь откроем Послание к Римлянам.',kind:'final'},
  {text:'Пятая глава, восьмой стих.',kind:'detected',ref:'Римлянам 5:8',confidence:92},
  {text:'Но Бог Свою любовь к нам доказывает тем.',kind:'final'},
  {text:'Что Христос умер за нас, когда мы были ещё грешниками.',kind:'final'},
  {text:'Обратите внимание, любовь проявляется действием.',kind:'final'},
  {text:'Давайте также посмотрим Первое послание Иоанна.',kind:'final'},
  {text:'Четвёртая глава, девятнадцатый стих.',kind:'detected',ref:'1 Иоанна 4:19',confidence:95},
  {text:'Будем любить Его, потому что Он прежде возлюбил нас.',kind:'final'},
  {text:'И дальше двадцатый стих говорит о любви к брату.',kind:'next',ref:'1 Иоанна 4:20',confidence:89},
  {text:'Если кто говорит: я люблю Бога, а брата своего ненавидит.',kind:'final'},
  {text:'Тот лжец, потому что не любящий брата не может любить Бога.',kind:'final'},
  {text:'Итак, любовь к Богу видна в нашей любви друг к другу.',kind:'final'},
  {text:'Перейдём теперь к Первому Коринфянам.',kind:'final'},
  {text:'Тринадцатая глава, первый стих.',kind:'detected',ref:'1 Коринфянам 13:1',confidence:97},
  {text:'Если я говорю языками человеческими и ангельскими.',kind:'final'},
  {text:'А любви не имею, то я медь звенящая.',kind:'final'},
  {text:'Следующий стих продолжает эту же мысль.',kind:'next',ref:'1 Коринфянам 13:2',confidence:93},
  {text:'Если имею дар пророчества и знаю все тайны.',kind:'final'},
  {text:'Но не имею любви, то я ничто.',kind:'final'},
  {text:'Пусть эта истина останется с нами сегодня.',kind:'final'}
]
const verses=[
  {ref:'Иоанна <span>3:16</span>',source:'Откроем Евангелие от Иоанна, третью главу, шестнадцатый стих.',label:'Verse detected'},
  {ref:'Иоанна <span>3:17</span>',source:'Теперь посмотрим следующий стих.',label:'Next verse detected'},
  {ref:'Римлянам <span>5:8</span>',source:'Пятая глава, восьмой стих.',label:'Verse detected'},
  {ref:'1 Иоанна <span>4:19</span>',source:'Четвёртая глава, девятнадцатый стих.',label:'Verse detected'},
  {ref:'1 Иоанна <span>4:20</span>',source:'И дальше двадцатый стих говорит о любви к брату.',label:'Next verse detected'},
  {ref:'1 Коринфянам <span>13:1</span>',source:'Тринадцатая глава, первый стих.',label:'Verse detected'},
  {ref:'1 Коринфянам <span>13:2</span>',source:'Следующий стих продолжает эту же мысль.',label:'Next verse detected'}
];
let verseIndex=0;

function showToast(message){clearTimeout(toastTimer);toast.textContent=message;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),1500)}
function pulseDetected(){app.classList.remove('detected');requestAnimationFrame(()=>app.classList.add('detected'));setTimeout(()=>app.classList.remove('detected'),1450)}
function setVerse(index){
  verseIndex=index%verses.length;
  reference.innerHTML=verses[verseIndex].ref;
  sourceText.textContent=verses[verseIndex].source;
  pulseDetected();
  showToast(verses[verseIndex].label);
}
let transcriptTarget=0;
let transcriptAutoScroll=true;
let transcriptLastAnimated=-1;

function refreshOpenTranscript(animateIndex=-1){
  if(sheetLayer.classList.contains('open')&&sheetTitle.textContent==='Live transcript') renderTranscript(animateIndex);
}
function applyTranscriptReference(line){
  const mapping={
    'Иоанна 3:16':0,'Иоанна 3:17':1,'Римлянам 5:8':2,
    '1 Иоанна 4:19':3,'1 Иоанна 4:20':4,'1 Коринфянам 13:1':5,'1 Коринфянам 13:2':6
  };
  if(line?.ref && mapping[line.ref]!==undefined) setVerse(mapping[line.ref]);
}
function startMockFlow(addCount=10){
  transcriptTarget=Math.min(transcriptLines.length,Math.max(transcriptTarget,transcriptIndex)+addCount);
  if(transcriptTimer) return;
  const advance=()=>{
    if(transcriptPaused) return;
    if((!listening&&!demoTranscriptRunning)||transcriptIndex>=transcriptTarget){
      clearInterval(transcriptTimer);transcriptTimer=null;
      if(transcriptIndex>=transcriptTarget&&!listening) demoTranscriptRunning=false;
      refreshOpenTranscript();
      return;
    }
    const next=transcriptLines[transcriptIndex];
    if(!next){clearInterval(transcriptTimer);transcriptTimer=null;return;}
    transcriptIndex+=1;
    applyTranscriptReference(next);
    refreshOpenTranscript(transcriptIndex-1);
  };
  advance();
  transcriptTimer=setInterval(advance,1000);
}
function stopMockFlow(){
  clearInterval(transcriptTimer);clearTimeout(verseTimer);clearInterval(typingTimer);
  transcriptTimer=null;verseTimer=null;typingTimer=null;
  refreshOpenTranscript();
}
function updateMainDownload(progress,label=currentModel){
  modelProgress=progress;
  app.style.setProperty('--load-progress',`${progress*3.6}deg`);
  statusText.textContent=progress<100?`Downloading ${label} · ${progress}%`:`${label} ready`;
  app.classList.toggle('model-loading',progress<100);
  const pct=document.querySelector('#downloadPct');
  const fill=document.querySelector('#downloadFill');
  if(pct) pct.textContent=progress<100?`${progress}%`:'Ready';
  if(fill) fill.style.width=`${progress}%`;
}
function loadModel(label,{thenListen=false}={}){
  clearInterval(downloadTimer);
  starting=true;
  app.classList.add('model-loading');
  listenBtn.textContent='Preparing model…';
  let p=0;
  updateMainDownload(0,label);
  const tick=()=>{
    p=Math.min(100,p+5+Math.floor(Math.random()*7));
    updateMainDownload(p,label);
    if(p>=100){
      clearInterval(downloadTimer);downloadTimer=null;loadedModels.add(label);starting=false;
      app.classList.remove('model-loading');
      showToast(`${label} ready`);
      if(thenListen) beginListening(); else {statusText.textContent='Ready to listen';renderListeningButton();const area=document.querySelector('#downloadArea');if(area)setTimeout(()=>area.innerHTML='',350);}
    }
  };
  downloadTimer=setInterval(tick,105);
}
function renderListeningButton(){
  listenBtn.innerHTML=listening?'<span class="stop-square"></span>Stop listening':'Start listening';
}
function beginListening(){
  listening=true;starting=false;transcriptPaused=false;
  app.classList.add('listening');
  statusText.textContent='Listening';
  renderListeningButton();
  startMockFlow(12);
  showToast('Listening started');
}
function setListening(next){
  if(starting) return;
  if(next){
    if(currentModel.startsWith('Whisper')&&!loadedModels.has(currentModel)) loadModel(currentModel,{thenListen:true});
    else beginListening();
  }else{
    listening=false;demoTranscriptRunning=false;starting=false;app.classList.remove('listening','model-loading');statusText.textContent='Ready to listen';renderListeningButton();stopMockFlow();showToast('Listening stopped');
  }
}
listenBtn.addEventListener('click',()=>setListening(!listening));
heroMic.addEventListener('click',()=>setListening(!listening));

function openSheet(name){closePopover();closeInlineMenus();sheetHeadActions.innerHTML='';document.querySelector('#sheet').classList.toggle('transcript-sheet',name==='transcript');sheetLayer.classList.add('open');sheetLayer.setAttribute('aria-hidden','false');
  if(name==='transcript'){sheetTitle.textContent='Live transcript';transcriptAutoScroll=true;renderTranscript()}
  if(name==='transcriber'){sheetTitle.textContent='Service transcriber';renderTranscriber()}
  if(name==='mic'){sheetTitle.textContent='Mic & recording test';renderMic()}
  if(name==='feedback'){sheetTitle.textContent='Report feedback';renderFeedback()}
  if(name==='settings'){sheetTitle.textContent='Settings';renderSettings()}
  if(name==='more'){sheetTitle.textContent='More';renderMore()}
}
function closeSheet(){sheetLayer.classList.remove('open');sheetLayer.setAttribute('aria-hidden','true');stopMicAnimation();closeInlineMenus();sheetHeadActions.innerHTML=''}
document.querySelector('#sheetClose').addEventListener('click',closeSheet);
sheetLayer.addEventListener('click',e=>{if(e.target===sheetLayer)closeSheet()});
document.querySelectorAll('[data-sheet]').forEach(b=>b.addEventListener('click',()=>openSheet(b.dataset.sheet)));
document.querySelector('#peekBtn').addEventListener('click',()=>openSheet('transcript'));
document.querySelector('#settingsBtn').addEventListener('click',()=>openSheet('settings'));
document.querySelector('#moreBtn').addEventListener('click',()=>openSheet('more'));

function renderTranscript(animateIndex=-1){
  const oldViewport=document.querySelector('#transcriptViewport');
  const previousTop=oldViewport?.scrollTop??0;
  const shouldPin=transcriptAutoScroll;
  const visible=transcriptLines.slice(0,transcriptIndex);
  const rows=visible.map((line,index)=>{
    const detected=line.kind==='detected'||line.kind==='next';
    const meta=detected?`<div class="transcript-detection-meta"><span class="confidence-pill">${line.confidence||92}%</span><button type="button" class="transcript-flag" data-report-line="${index}" aria-label="Report ${line.ref}" title="Report detection">${svg('flag')}</button></div>`:'';
    return `<div class="transcript-row ${detected?'detected':''} ${index===animateIndex?'enter':''}"><div class="transcript-row-main"><span>${line.text}</span>${line.ref?`<small>${line.ref}</small>`:''}</div>${meta}</div>`;
  }).join('');
  const running=(listening||demoTranscriptRunning)&&!transcriptPaused;
  sheetHeadActions.innerHTML=`<button type="button" id="toggleTranscriptPlayback" class="transcript-play-toggle ${running?'active':''}" aria-label="${running?'Pause':'Resume'} transcript" title="${running?'Pause transcript':'Resume transcript'}">${svg(running?'pause':'play')}</button>`;
  sheetContent.innerHTML=`<section class="sheet-section transcript-section-inner"><div class="sheet-label"><span>Live transcript</span><strong>${running?'Running':transcriptPaused?'Paused':'Waiting'}</strong></div><div class="transcript-viewport" id="transcriptViewport"><div class="transcript-stream">${rows||'<div class="empty-state">No transcript yet.</div>'}<div class="loading-row ${running?'active':''}"><span>${running?'Listening…':transcriptPaused?'Paused':'Waiting…'}</span><div class="loading-wave">${Array.from({length:8},()=>'<i></i>').join('')}</div></div></div></div></section>`;
  const viewport=document.querySelector('#transcriptViewport');
  viewport.addEventListener('scroll',()=>{
    transcriptAutoScroll=viewport.scrollTop+viewport.clientHeight>=viewport.scrollHeight-24;
  },{passive:true});
  requestAnimationFrame(()=>{
    if(shouldPin){viewport.scrollTop=viewport.scrollHeight;transcriptAutoScroll=true;}
    else viewport.scrollTop=previousTop;
  });
  document.querySelector('#toggleTranscriptPlayback').addEventListener('click',()=>{
    transcriptPaused=!transcriptPaused;
    if(!transcriptPaused){
      demoTranscriptRunning=true;
      if(transcriptIndex>=transcriptTarget) transcriptTarget=Math.min(transcriptLines.length,transcriptIndex+10);
      startMockFlow(0);
      showToast('Transcript resumed');
    }else{
      showToast('Transcript paused');
    }
    renderTranscript();
  });
  document.querySelectorAll('[data-report-line]').forEach(button=>button.addEventListener('click',e=>{
    e.stopPropagation();
    const line=transcriptLines[Number(button.dataset.reportLine)];
    openFeedbackOverlay(line);
  }));
  if(animateIndex>=0) transcriptLastAnimated=animateIndex;
}

function wireFeedback(prefix,closeAfterSend,context=null){
  const timingBlock=document.querySelector('#'+prefix+'FeedbackTimingBlock');
  const updateTiming=(value)=>{if(timingBlock)timingBlock.hidden=value!=='⏱️ Detected too late'};
  bindSelect(prefix+'FeedbackIssue',updateTiming);bindSelect(prefix+'FeedbackTiming');bindSelect(prefix+'FeedbackDuration');
  updateTiming(document.querySelector('#'+prefix+'FeedbackIssue')?.dataset.value||'');
  const mini=document.querySelector('#'+prefix+'FeedbackMini');
  const recentTranscript=prefix==='overlay'?document.querySelector('#overlayRecentTranscript'):document.querySelector('#recentTranscriptBtn');
  const recentAudio=prefix==='overlay'?document.querySelector('#overlayRecentAudio'):document.querySelector('#recentAudioBtn');
  const showMini=(kind)=>{
    closeInlineMenus();
    if(kind==='transcript') mini.innerHTML=`<strong>Recent transcript</strong><p>${transcriptLines.slice(Math.max(0,transcriptIndex-5),Math.max(3,transcriptIndex)).map(x=>x.text).join('<br><br>')}</p>`;
    else mini.innerHTML=`<strong>Recent audio</strong><p>Recent mock listener audio is ready to preview.</p><button class="audio-preview glass-row" id="${prefix}MiniAudioPlay" style="margin-top:7px">${svg('play')} Preview audio</button>`;
    mini.hidden=false;
    document.querySelector('#'+prefix+'MiniAudioPlay')?.addEventListener('click',e=>{e.currentTarget.classList.toggle('playing');showToast(e.currentTarget.classList.contains('playing')?'Playing recent audio':'Audio preview stopped')});
  };
  recentTranscript?.addEventListener('click',e=>{e.stopPropagation();showMini('transcript')});
  recentAudio?.addEventListener('click',e=>{e.stopPropagation();showMini('audio')});
  if(context){
    const notes=document.querySelector('#'+prefix+'FeedbackNotes');
    if(notes) notes.placeholder=`Optional note about ${context.ref||'this detection'}…`;
  }
  document.querySelector('#'+prefix+'SendFeedback').addEventListener('click',e=>{e.currentTarget.disabled=true;const st=document.querySelector('#'+prefix+'FeedbackStatus');st.textContent='Saving privately…';setTimeout(()=>st.textContent='Sending feedback…',400);setTimeout(()=>{showToast('Feedback sent');closeAfterSend();},1000)});
}
